[project]
name = "ai-dev-team"
version = "0.1.0"
description = "Local multi-agent software engineering assistant built with LangGraph and Ollama."
readme = "README.md"
authors = [
    { name = "Maria Eugenia Riggi", email = "mriggi1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.2",
    "ruff>=0.16.8",
]

[project.scripts]
ai-dev-team = "ai_dev_team:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
